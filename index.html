<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Piano White Neon</title>
    <style>
        * { 
            box-sizing: border-box; touch-action: none; 
            -webkit-touch-callout: none; -webkit-user-select: none; 
            user-select: none; -webkit-tap-highlight-color: transparent; 
        }
        body { background: #000; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, sans-serif; }
        
        .top-bar {
            height: 18vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: #111; border-bottom: 1px solid #333; gap: 10px;
        }
        .row { display: flex; gap: 10px; }

        .btn {
            background: #222; color: #eee; border: 1px solid #444; padding: 10px 15px;
            border-radius: 8px; font-size: 13px; font-weight: bold;
        }
        .btn.active { background: #00ffff; color: #000; border-color: #fff; box-shadow: 0 0 10px #00ffff; }
        .nav-btn { color: #00ffff; font-size: 20px; padding: 5px 20px; }

        .piano-container { 
            width: 100vw; height: 82vh; overflow: hidden; position: relative; background: #000;
        }
        .piano-wrapper { 
            display: flex; height: 100%; position: absolute; left: 0; top: 0; 
            transition: left 0.3s ease-out; width: max-content;
        }

        /* PHÍM TRẮNG - ĐẢM BẢO HIỆN MÀU TRẮNG */
        .white-key {
            display: block; background: #ffffff !important; border: 1px solid #ddd;
            height: 100%; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px;
            position: relative; z-index: 1; transition: transform 0.1s;
        }
        
        /* Hiệu ứng Neon Inset (Vô form, không tràn) */
        .white-key.active { 
            background: #f0ffff !important;
            transform: translateY(5px);
            box-shadow: inset 0 0 20px #00ffff, inset 0 0 40px rgba(0,255,255,0.4);
            border-color: #00ffff; z-index: 10;
        }

        /* PHÍM ĐEN */
        .black-key {
            background: #222; position: absolute; z-index: 2;
            border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;
            border: 1px solid #000; transition: transform 0.1s;
        }
        .black-key.active { 
            background: #ff0055; box-shadow: 0 0 20px #ff0055;
            transform: translateY(3px); z-index: 11;
        }

        .label { position: absolute; bottom: 15px; width: 100%; text-align: center; color: #999; font-size: 11px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="row">
            <button class="btn nav-btn" onclick="move(-1)">◀</button>
            <button class="btn" id="pedalBtn">SUSTAIN</button>
            <button class="btn nav-btn" onclick="move(1)">▶</button>
        </div>
        <div class="row">
            <button class="btn" id="z8" onclick="setZoom(8)">TO</button>
            <button class="btn" id="z12" onclick="setZoom(12)">VỪA</button>
            <button class="btn" id="z15" onclick="setZoom(15)">NHỎ</button>
        </div>
    </div>

    <div class="piano-container">
        <div class="piano-wrapper" id="pianoContent"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isSustain = false, visibleKeys = 12, offset = 0, activePointers = new Set();

        const notes = [];
        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        for (let oct = 2; oct <= 6; oct++) names.forEach(n => notes.push({ n: n + oct, f: 440 * Math.pow(2, ( (oct-4) + (names.indexOf(n)-9)/12 )) }));

        function render() {
            const container = document.getElementById('pianoContent'); 
            container.innerHTML = '';
            const keyWidth = window.innerWidth / visibleKeys;
            let whiteKeyCount = 0;

            notes.forEach((note, i) => {
                if (!note.n.includes('#')) {
                    const k = document.createElement('div');
                    k.className = 'white-key';
                    k.style.width = keyWidth + 'px';
                    k.innerHTML = `<div class="label">${note.n}</div>`;
                    
                    k.onpointerdown = (e) => { e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(note.f, k); };
                    k.onpointerenter = () => { if(activePointers.size > 0) play(note.f, k); };
                    container.appendChild(k);

                    const next = notes[i+1];
                    if (next && next.n.includes('#')) {
                        const bk = document.createElement('div');
                        bk.className = 'black-key';
                        bk.style.width = (keyWidth * 0.65) + 'px';
                        bk.style.height = '58%';
                        bk.style.left = ((whiteKeyCount + 1) * keyWidth - (keyWidth * 0.325)) + 'px';
                        bk.onpointerdown = (e) => { e.stopPropagation(); e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(next.f, bk); };
                        bk.onpointerenter = () => { if(activePointers.size > 0) play(next.f, bk); };
                        container.appendChild(bk);
                    }
                    whiteKeyCount++;
                }
            });
            container.style.left = "0px"; offset = 0;
            updateBtnStyle();
        }

            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
