<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Piano Ultra Form</title>
    <style>
        * { 
            box-sizing: border-box; touch-action: none; 
            -webkit-touch-callout: none; -webkit-user-select: none; 
            user-select: none; -webkit-tap-highlight-color: transparent; 
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* Bảng điều khiển */
        .top-bar {
            height: 20vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: #080808; border-bottom: 2px solid #222; gap: 8px;
        }
        .row { display: flex; gap: 10px; align-items: center; }

        .btn {
            background: #1a1a1a; color: #888; border: 1px solid #333; padding: 10px 14px;
            border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.1s;
        }
        .btn.active { background: #00ffff; color: #000; border-color: #fff; box-shadow: 0 0 15px #00ffff; }
        .nav-btn { font-size: 20px; color: #00ffff; padding: 5px 25px; border-color: #00ffff; }

        /* Vùng đàn */
        .piano-container { 
            width: 100vw; height: 80vh; overflow: hidden; position: relative; 
            /* Lớp nền đen để làm nổi bật phím */
            background: #000; 
        }
        .piano-wrapper { display: flex; height: 100%; position: absolute; left: 0; top: 0; transition: left 0.3s ease-out; }

        /* PHÍM TRẮNG - GIỮ FORM SẮC NÉT HOÀN TOÀN */
        .white-key {
            display: inline-block;
            /* Phím nền đen, Form chính là màu nền này */
            background: #111; 
            
            /* TẠO VIỀN SẮC NÉT BẰNG CÁCH DÙNG MARGIN */
            margin: 1px; /* Tạo khoảng hở 1px xung quanh, lộ nền đen ra */
            
            height: calc(100% - 2px); /* Trừ margin */
            border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;
            position: relative; z-index: 1;
            /* Transition màu nền để form không bị biến đổi */
            transition: background 0.1s;
        }
        
        /* HIỆU ỨNG PHÁT SÁNG BẰNG CÁCH ĐỔI MÀU NỀN */
        .white-key.active { 
            /* Đổi nền sang màu xanh Neon rực rỡ */
            background: rgba(0, 255, 255, 1);
            
            /* Thêm hiệu ứng Glow ảo ảnh, nhưng giữ form nguyên vẹn */
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            
            /* Thêm một chút đổ bóng thật nhẹ ở dưới để tạo cảm giác 3D */
            box-shadow: 0 2px 5px rgba(0, 255, 255, 0.4);
            
            transform: translateY(2px); /* Hiệu ứng nhấn */
            z-index: 10;
        }

        /* PHÍM ĐEN */
        .black-key {
            background: #222; position: absolute; z-index: 2;
            margin: 1px; height: 58%;
            border-bottom-left-radius: 4px; border-bottom-right-radius: 4px;
            border: 1px solid #000; transition: all 0.1s;
        }
        .black-key.active { 
            background: #ff0055; transform: translateY(1px);
            box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            border-color: #fff; z-index: 11;
        }

        .label { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #888; font-size: 10px; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="row">
            <button class="btn nav-btn" onclick="move(-1)">◀</button>
            <button class="btn" id="pedalBtn">PEDAL</button>
            <button class="btn" onclick="setInst('piano')" active>PIANO</button>
            <button class="btn nav-btn" onclick="move(1)">▶</button>
        </div>
        <div class="row">
            <button class="btn" onclick="setZoom(8)">TO</button>
            <button class="btn active" onclick="setZoom(12)">VỪA</button>
            <button class="btn" onclick="setZoom(15)">NHỎ</button>
        </div>
    </div>

    <div class="piano-container">
        <div class="piano-wrapper" id="pianoContent"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isSustain = false, visibleKeys = 12, offset = 0, instrument = 'piano', activePointers = new Set();

        const notes = [];
        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        // Tạo 4 quãng tám (C2 đến C6)
        for (let oct = 2; oct <= 6; oct++) names.forEach(n => notes.push({ n: n + oct, f: 440 * Math.pow(2, ( (oct-4) + (names.indexOf(n)-9)/12 )) }));

        function render() {
            const container = document.getElementById('pianoContent'); container.innerHTML = '';
            const kw = window.innerWidth / visibleKeys; let wCount = 0;
            notes.forEach((note, i) => {
                if (!note.n.includes('#')) {
                    const k = document.createElement('div'); k.className = 'white-key'; 
                    /* Thêm một lớp bọc ngoài để cố định Form phím trắng */
                    const kWrapper = document.createElement('div');
                    kWrapper.style.width = kw+'px';
                    kWrapper.style.height = '100%';
                    kWrapper.appendChild(k);
                    
                    k.style.width = `calc(${kw}px - 2px)`; // Trừ margin 2 cạnh
                    k.innerHTML = `<div class="label">${note.n}</div>`;
                    
                    // Logic vuốt Đa điểm chuyên nghiệp
                    k.onpointerdown = (e) => { e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(note.f, k); };
                    k.onpointerenter = () => { if(activePointers.size > 0) play(note.f, k); };
                    container.appendChild(kWrapper);

                    const next = notes[i+1];
                    if (next && next.n.includes('#')) {
                        const bk = document.createElement('div'); bk.className = 'black-key';
                        bk.style.width = (kw*0.65)+'px'; 
                        bk.style.left = ((wCount+1)*kw - (kw*0.325))+'px';
                        bk.onpointerdown = (e) => { e.stopPropagation(); e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(next.f, bk); };
                        bk.onpointerenter = () => { if(activePointers.size > 0) play(next.f, bk); };
                        container.appendChild(bk);
                    }
                    wCount++;
                }
            });
            // Reset vị trí
            container.style.left = "0px"; offset = 0;
        }

        function createOsc(f) {
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
            // Tiếng Piano ấm & sạch
            osc.type = 'square'; osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (isSustain ? 2.8 : 0.8));
            osc.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 3);
        }

        function play(f, el) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            createOsc(f); // Chỉ chơi Piano cho sạch tiếng
            el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 200);
        }

        function move(dir) { 
            const step = (window.innerWidth / visibleKeys) * 3;
            offset -= step * dir; 
            const maxScroll = -(document.getElementById('pianoContent').offsetWidth - window.innerWidth);
            if (offset > 0) offset = 0; if (offset < maxScroll) offset = maxScroll;
            document.getElementById('pianoContent').style.left = offset+'px'; 
        }

        function setZoom(z) { 
            visibleKeys = z; render(); 
            document.querySelectorAll('.top-bar .btn').forEach(b => { if(!b.id.startsWith('pedal')) b.classList.remove('active'); });
            // Highlight nút size đang chọn (tùy chỉnh lại ID nút)
        }

        window.onpointerup = (e) => activePointers.delete(e.pointerId);
        window.onpointercancel = (e) => activePointers.delete(e.pointerId);
        document.getElementById('pedalBtn').onclick = function() { isSustain = !isSustain; this.classList.toggle('active'); };
        
        render();
        window.onresize = render;
    </script>
</body>
</html>
