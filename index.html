<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Piano Crystal Clear</title>
    <style>
        * { 
            box-sizing: border-box; touch-action: none; 
            -webkit-touch-callout: none; -webkit-user-select: none; 
            user-select: none; -webkit-tap-highlight-color: transparent; 
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        .top-bar {
            height: 18vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: #111; border-bottom: 1px solid #333; gap: 8px;
        }
        .row { display: flex; gap: 8px; }

        .btn {
            background: #222; color: #eee; border: 1px solid #444; padding: 10px 15px;
            border-radius: 6px; font-size: 12px; font-weight: bold;
        }
        .btn.active { background: #00ffff; color: #000; border-color: #fff; box-shadow: 0 0 10px #00ffff; }
        .nav-btn { color: #00ffff; font-size: 18px; padding: 5px 20px; }

        .piano-container { width: 100vw; height: 82vh; overflow: hidden; position: relative; background: #000; }
        .piano-wrapper { display: flex; height: 100%; position: absolute; left: 0; transition: left 0.3s ease-out; }

        /* PHÍM TRẮNG - TRẮNG TINH KHÔI, FORM CHUẨN */
        .white-key {
            display: inline-block;
            background: #ffffff; /* Đã đưa về màu trắng */
            border: 1px solid #ccc;
            height: 100%;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            position: relative;
            z-index: 1;
            transition: all 0.1s;
        }
        
        /* Hiệu ứng khi bấm: Neon "vô form" không tràn */
        .white-key.active { 
            background: #e0ffff; /* Trắng xanh nhẹ */
            transform: translateY(4px);
            /* Dùng inset shadow để màu chỉ tỏa vào trong, không tràn ra ngoài */
            box-shadow: inset 0 0 25px #00ffff, inset 0 0 50px rgba(0,255,255,0.3);
            border-color: #00ffff;
            z-index: 10;
        }

        /* PHÍM ĐEN */
        .black-key {
            background: #222;
            position: absolute;
            z-index: 2;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            border: 1px solid #000;
            transition: all 0.1s;
        }
        .black-key.active { 
            background: #ff0055;
            box-shadow: 0 0 20px #ff0055;
            transform: translateY(2px);
            z-index: 11;
        }

        .label { position: absolute; bottom: 15px; width: 100%; text-align: center; color: #888; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="row">
            <button class="btn nav-btn" onclick="move(-1)">◀</button>
            <button class="btn" id="pedalBtn">PEDAL: OFF</button>
            <button class="btn" onclick="setZoom(8)">TO</button>
            <button class="btn" onclick="setZoom(12)">NHỎ</button>
            <button class="btn nav-btn" onclick="move(1)">▶</button>
        </div>
    </div>

    <div class="piano-container">
        <div class="piano-wrapper" id="pianoContent"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isSustain = false, visibleKeys = 12, offset = 0, activePointers = new Set();

        const notes = [];
        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        for (let oct = 2; oct <= 6; oct++) names.forEach(n => notes.push({ n: n + oct, f: 440 * Math.pow(2, ( (oct-4) + (names.indexOf(n)-9)/12 )) }));

        function render() {
            const container = document.getElementById('pianoContent'); container.innerHTML = '';
            const kw = window.innerWidth / visibleKeys;
            let wCount = 0;

            notes.forEach((note, i) => {
                if (!note.n.includes('#')) {
                    const k = document.createElement('div');
                    k.className = 'white-key';
                    k.style.width = kw + 'px';
                    k.innerHTML = `<div class="label">${note.n}</div>`;
                    
                    k.onpointerdown = (e) => { e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(note.f, k); };
                    k.onpointerenter = () => { if(activePointers.size > 0) play(note.f, k); };
                    container.appendChild(k);

                    const next = notes[i+1];
                    if (next && next.n.includes('#')) {
                        const bk = document.createElement('div');
                        bk.className = 'black-key';
                        bk.style.width = (kw * 0.65) + 'px';
                        bk.style.height = '58%';
                        bk.style.left = ((wCount + 1) * kw - (kw * 0.325)) + 'px';
                        bk.onpointerdown = (e) => { e.stopPropagation(); e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(next.f, bk); };
                        bk.onpointerenter = () => { if(activePointers.size > 0) play(next.f, bk); };
                        container.appendChild(bk);
                    }
                    wCount++;
                }
            });
            container.style.left = "0px"; offset = 0;
        }

        function play(f, el) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
            osc.type = 'square';
            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(900, audioCtx.currentTime);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (isSustain ? 2.5 : 0.8));
            osc.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 2.8);
            el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 250);
        }

        function move(dir) {
            const step = (window.innerWidth / visibleKeys) * 4;
            offset -= step * dir;
            const max = -(document.getElementById('pianoContent').offsetWidth - window.innerWidth);
            if (offset > 0) offset = 0; if (offset < max) offset = max;
            document.getElementById('pianoContent').style.left = offset + 'px';
        }

        function setZoom(z) { visibleKeys = z; render(); }
        window.onpointerup = (e) => activePointers.delete(e.pointerId);
        document.getElementById('pedalBtn').
