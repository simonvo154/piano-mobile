<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Piano Studio Pro Max</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #111; margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: white; }
        
        /* Bảng điều khiển phía trên */
        .top-bar {
            height: 25vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: linear-gradient(to bottom, #222, #111);
            border-bottom: 2px solid #333; gap: 10px;
        }
        .controls-row { display: flex; gap: 15px; align-items: center; }

        /* Nút bấm */
        .btn {
            background: #444; color: white; border: 1px solid #666; padding: 10px 20px;
            border-radius: 5px; font-weight: bold; font-size: 14px;
        }
        .btn:active { background: #666; }
        .btn.active { background: #00FF00; color: black; border-color: #fff; }

        /* Container chứa đàn và thanh trượt */
        .piano-container {
            width: 100vw; height: 75vh; overflow-x: auto; overflow-y: hidden;
            position: relative; white-space: nowrap; scroll-behavior: smooth;
        }
        /* Ẩn thanh cuộn để trông như app thật */
        .piano-container::-webkit-scrollbar { display: none; }

        .piano-wrapper { display: flex; height: 100%; position: relative; }

        /* Phím trắng */
        .white-key {
            display: inline-block; background: white; border: 1px solid #ccc;
            height: 100%; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
            position: relative; z-index: 1; transition: background 0.1s;
        }
        .white-key:active, .white-key.active { background: #FFD700; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }

        /* Phím đen */
        .black-key {
            background: #222; position: absolute; z-index: 2;
            border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;
            transition: background 0.1s; border: 1px solid #000;
        }
        .black-key:active, .black-key.active { background: #FF4444; }

        /* Nhãn nốt nhạc */
        .key-label {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #888; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-row">
            <button class="btn" id="pedalBtn">PEDAL: OFF</button>
            <div style="font-size: 12px; color: #aaa;">KÉO ĐỂ DI CHUYỂN PHÍM ↔️</div>
        </div>
        <div class="controls-row">
            <span style="font-size: 13px;">KÍCH THƯỚC:</span>
            <button class="btn" onclick="changeZoom(8)">TO (8 phím)</button>
            <button class="btn" onclick="changeZoom(12)">VỪA (12 phím)</button>
            <button class="btn" onclick="changeZoom(15)">NHỎ (15 phím)</button>
        </div>
    </div>

    <div class="piano-container" id="scrollContainer">
        <div class="piano-wrapper" id="pianoWrapper"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isSustain = false;
        let visibleKeys = 12; // Số phím trắng hiển thị mặc định

        // Dữ liệu 4 quãng tám (C2 đến C6)
        const notes = [];
        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const freqs = [65.41, 69.30, 73.42, 77.78, 82.41, 87.31, 92.50, 98.00, 103.83, 110.00, 116.54, 123.47, 
                       130.81, 138.59, 146.83, 155.56, 164.81, 174.61, 185.00, 196.00, 207.65, 220.00, 233.08, 246.94,
                       261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00, 466.16, 493.88,
                       523.25, 554.37, 587.33, 622.25, 659.25, 698.46, 739.99, 783.99, 830.61, 880.00, 932.33, 987.77, 1046.50];

        let freqIndex = 0;
        for (let oct = 2; oct <= 5; oct++) {
            names.forEach(name => {
                notes.push({ n: name + oct, f: freqs[freqIndex++] });
            });
        }
        notes.push({ n: 'C6', f: freqs[freqIndex] });

        const wrapper = document.getElementById('pianoWrapper');

        function renderPiano() {
            wrapper.innerHTML = '';
            const keyWidth = 100 / visibleKeys;
            let whiteKeyCount = 0;

            notes.forEach((note, index) => {
                if (!note.n.includes('#')) {
                    const key = document.createElement('div');
                    key.className = 'white-key';
                    key.style.minWidth = `${keyWidth}vw`;
                    key.innerHTML = `<div class="key-label">${note.n}</div>`;
                    key.addEventListener('pointerdown', (e) => { e.preventDefault(); playNote(note.f, key); });
                    wrapper.appendChild(key);

                    const nextNote = notes[index + 1];
                    if (nextNote && nextNote.n.includes('#')) {
                        const bKey = document.createElement('div');
                        bKey.className = 'black-key';
                        bKey.style.width = `${keyWidth * 0.7}vw`;
                        bKey.style.height = `60%`;
                        bKey.style.left = `${(whiteKeyCount + 1) * keyWidth - (keyWidth * 0.35)}vw`;
                        bKey.addEventListener('pointerdown', (e) => { 
                            e.preventDefault(); e.stopPropagation(); playNote(nextNote.f, bKey); 
                        });
                        wrapper.appendChild(bKey);
                    }
                    whiteKeyCount++;
                }
            });
        }

        function playNote(freq, element) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            const duration = isSustain ? 3.0 : 0.8;
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
            element.classList.add('active');
            setTimeout(() => element.classList.remove('active'), 200);
        }

        function changeZoom(size) {
            visibleKeys = size;
            renderPiano();
        }

        document.getElementById('pedalBtn').onclick = function() {
            isSustain = !isSustain;
            this.textContent = `PEDAL: ${isSustain ? 'ON' : 'OFF'}`;
            this.classList.toggle('active');
        };

        renderPiano();
    </script>
</body>
</html>
