<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Piano & Sax Mobile</title>
    <style>
        * { 
            box-sizing: border-box; touch-action: none; 
            -webkit-touch-callout: none; -webkit-user-select: none; 
            user-select: none; -webkit-tap-highlight-color: transparent; 
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        .top-bar {
            height: 25vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: #1a1a1a; border-bottom: 2px solid #333; gap: 8px;
        }
        .row { display: flex; gap: 10px; align-items: center; }

        .btn {
            background: #333; color: white; border: 1px solid #555; padding: 10px 15px;
            border-radius: 8px; font-size: 13px; font-weight: bold;
        }
        .btn.active { background: #ffd700; color: #000; border-color: #fff; }
        .nav-btn { background: #444; font-size: 18px; padding: 8px 25px; border: 1px solid #ffd700; }

        .piano-container { width: 100vw; height: 75vh; overflow: hidden; position: relative; }
        .piano-wrapper { display: flex; height: 100%; position: absolute; left: 0; transition: left 0.3s; }

        .white-key { display: inline-block; background: white; border: 1px solid #ccc; height: 100%; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; position: relative; z-index: 1; }
        .white-key.active { background: #ffd700; }
        .black-key { background: #222; position: absolute; z-index: 2; border-bottom-left-radius: 5px; border-bottom-right-radius: 5px; }
        .black-key.active { background: #ff4444; }
        .label { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #888; font-size: 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="row">
            <button class="btn nav-btn" onclick="move(-1)">◀</button>
            <button class="btn" id="pedalBtn">PEDAL: OFF</button>
            <button class="btn nav-btn" onclick="move(1)">▶</button>
        </div>
        <div class="row">
            <button class="btn active" id="pBtn" onclick="setInst('piano')">PIANO</button>
            <button class="btn" id="sBtn" onclick="setInst('sax')">SAXOPHONE</button>
            <button class="btn" onclick="setZoom(8)">TO</button>
            <button class="btn" onclick="setZoom(12)">NHỎ</button>
        </div>
    </div>

    <div class="piano-container">
        <div class="piano-wrapper" id="pianoContent"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isSustain = false, visibleKeys = 12, offset = 0, instrument = 'piano', activePointers = new Set();

        const notes = [];
        const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        for (let oct = 2; oct <= 6; oct++) names.forEach(n => notes.push({ n: n + oct, f: 440 * Math.pow(2, ( (oct-4) + (names.indexOf(n)-9)/12 )) }));

        function render() {
            const container = document.getElementById('pianoContent'); container.innerHTML = '';
            const kw = window.innerWidth / visibleKeys; let wCount = 0;
            notes.forEach((note, i) => {
                if (!note.n.includes('#')) {
                    const k = document.createElement('div'); k.className = 'white-key'; k.style.width = kw+'px';
                    k.innerHTML = `<div class="label">${note.n}</div>`;
                    k.onpointerdown = (e) => { e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(note.f, k); };
                    k.onpointerenter = () => { if(activePointers.size > 0) play(note.f, k); };
                    container.appendChild(k);
                    const next = notes[i+1];
                    if (next && next.n.includes('#')) {
                        const bk = document.createElement('div'); bk.className = 'black-key';
                        bk.style.width = kw*0.65+'px'; bk.style.height = '58%'; bk.style.left = (wCount+1)*kw - (kw*0.325)+'px';
                        bk.onpointerdown = (e) => { e.stopPropagation(); e.target.releasePointerCapture(e.pointerId); activePointers.add(e.pointerId); play(next.f, bk); };
                        bk.onpointerenter = () => { if(activePointers.size > 0) play(next.f, bk); };
                        container.appendChild(bk);
                    }
                    wCount++;
                }
            });
        }

        function play(f, el) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
            
            if (instrument === 'piano') {
                osc.type = 'square'; // Piano dùng sóng vuông có lọc sẽ ấm hơn
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);
                g.gain.setValueAtTime(0.4, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (isSustain ? 2.5 : 0.8));
            } else {
                osc.type = 'sawtooth'; // Saxophone dùng sóng răng cưa
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            }

            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            osc.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 2.5);
            el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 150);
        }

        function setInst(i) { 
            instrument = i; 
            document.getElementById('pBtn').classList.toggle('active', i==='piano');
            document.getElementById('sBtn').classList.toggle('active', i==='sax');
        }
        function move(dir) { offset -= (window.innerWidth/visibleKeys*4)*dir; document.getElementById('pianoContent').style.left = offset+'px'; }
        function setZoom(z) { visibleKeys = z; render(); }
        window.onpointerup = (e) => activePointers.delete(e.pointerId);
        document.getElementById('pedalBtn').onclick = function() { isSustain = !isSustain; this.textContent = `PEDAL: ${isSustain ? 'ON' : 'OFF'}`; this.classList.toggle('active'); };
        render();
    </script>
</body>
</html>
